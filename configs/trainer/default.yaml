_target_: lightning.pytorch.trainer.Trainer

default_root_dir: ${paths.output_dir}

min_epochs: 1 # prevents early stopping
max_epochs: null

accelerator: cpu
devices: 1

# mixed precision for extra speed-up
# precision: 16

# gradient_clip_val: 0.5

num_sanity_val_steps: 1 # before training starts
log_every_n_steps: 1000
limit_val_batches: 50  # evaluate this number of (sub-)trajectories
# limit_train_batches: 500  # train on this number of (sub-)trajectories
# # the next two arguments run validation every N training steps, and should be used 
# # with model_checkpoint: every_n_train_steps: 10_000
check_val_every_n_epoch: null
val_check_interval: 10_000
max_steps: 500_000

# set True to ensure deterministic results
# makes training slower but gives more reproducibility than just setting seeds
deterministic: False
