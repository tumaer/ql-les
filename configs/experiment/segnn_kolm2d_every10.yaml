# @package _global_
defaults:
  - override /model: segnn
  - override /data: kolm2d_every10
  - override /trainer: gpu
  - override /vars: kolm2d
  - override /callbacks: default
  - override /logger: wandb

model:
  _target_: src.models.gnn_module.GNNLitModule
  net:
    noise_std: 3.0e-4 # TODO:  Ablate this.
    node_features_type: ["v", "u"]
  pushforward: null
  vel_solver: "simple" # "simple", "tvf", "neural_sph"
  alpha_u: 1.0
  alpha_v: 1.0

tags: ["kolm", "segnn"]

logger:
  wandb:
    project: "kolm2d_every10"

seed: 12345
