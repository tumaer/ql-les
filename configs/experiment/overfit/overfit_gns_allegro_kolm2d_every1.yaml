# @package _global_
defaults:
  - override /model: gns
  - override /data: kolm2d_every1_debug
  - override /trainer: gpu
  - override /vars: kolm2d
  - override /callbacks: default
  - override /logger: wandb
  - override /debug: default

model:
  _target_: src.models.gnn_module.GNNLitModule
  net:
    noise_std: 0.0
    local_interaction: true # Disable message passing (Allegro-style: Musaelian et al. (2022), information propagation)
    num_message_passing_steps: 5 # Number of interaction steps in this case
  pushforward: null
  vel_solver: "simple" # "simple", "tvf", "neural_sph"
  alpha_u: 1.0
  alpha_v: 1.0

tags: ["kolm", "gns"]

logger:
  wandb:
    project: "kolm2d_every10"

seed: 12345
