# @package _global_

# to execute this experiment run:
# python train.py experiment=gns_experiment
defaults:
  - override /model: gns
  - override /data: 2d_kolm
  - override /trainer: default
  - override /callbacks: custom

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["kolm", "gns"]

#for eval
# ckpt_path: ${paths.log_dir}/train/runs/2025-01-14_12-57-09/checkpoints/epoch=1-step=12000.ckpt # Replace with the path to the exact checkpoint file

callbacks:
  model_summary:
    max_depth: 1

data:
  batch_size: 1

model:
  _target_: src.models.gns_kolm_module.GNSLitModule
  net:
    # particle_dimension: 2
    node_in: 38
    edge_in: 3
    latent_dim: 128
    node_out: 4 #Specify the dimension of the output. Example: 2 for predicting a single acceleration value for 2D coordinates
    num_message_passing_steps: 10
    mlp_num_layers: 10
    mlp_hidden_dim: 128
    noise_std: 6.7e-4 
    num_particle_types: 9
    particle_type_embedding_size: 16
    dataset_path: ${data.data_dir} # Path to the dataset
    connectivity_radius: 0.15  #Default value for KOLM dataset(derived from metadata), can be adjusted
  
  vel_solver: "neural_sph"
  noise_std: 3e-4 #Random-walk noise
  pbc: true
  alpha_u: 1.0
  alpha_v: 1.0

trainer:
  min_epochs: 0
  max_epochs: 2
  gradient_clip_val: 0.5
  accelerator: "gpu"

logger:
  wandb:
    tags: ${tags}
    group: "gns"
  aim:
    experiment: "gns"

seed: 12345

