# @package _global_
defaults:
  - override /model: gns
  - override /data: kolm2d_every1
  - override /trainer: gpu
  - override /vars: kolm2d
  - override /callbacks: custom
  - override /logger: wandb

model:
  _target_: src.models.gnn_module.GNNLitModule
  net:
    noise_std: 3.0e-5
  pushforward: null
  vel_solver: "simple"  # "simple", "tvf", "neural_sph"
  alpha_u: 1.0
  alpha_v: 1.0

tags: ["kolm", "gns"]

logger:
  wandb:
    project: "kolm2d_every1"

seed: 12345
