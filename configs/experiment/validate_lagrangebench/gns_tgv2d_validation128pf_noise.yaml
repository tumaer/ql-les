# @package _global_
defaults:
  - override /model: gns
  - override /data: tgv2d
  - override /trainer: gpu
  - override /vars: tgv2d
  - override /callbacks: custom
  - override /logger: wandb

model:
  _target_: src.models.simulator_module.SimulatorLitModule # Adjust this to the actual path for your GNS Lightning module
  net:
    latent_dim: 128
    mlp_hidden_dim: 128
    mlp_num_layers: 1
    num_message_passing_steps: 10
    particle_type_embedding_size: 16
    noise_std: 3.0e-4 #Random-walk noise
  pushforward:
    steps: [-1, 10000, 20000, 30000] # Training steps unlocking stages [-1, 10000, 20000, 30000]
    unrolls: #[0, 2, ${max_pushforward_steps}]   # Unroll step options for each stage
      - 0
      - 1
      - 2
      - ${vars.max_pushforward_steps}
    probs: [18, 2, 1, 1] # Relative probabilities for each unroll step
  scheduler:
    init_value: 1.0e-4
    end_value: 1.0e-6
    decay_rate: 0.1
    transition_steps: 100000
  visualize:
    vis_test:
      out_type: "vtk"

tags: ["tgv", "gns"]

logger:
  wandb:
    project: "tgv2d_val_lagBench"

seed: 12345

data:
  data_dir: ${paths.data_dir}/2D_TGV_DEBUG
  shuffle: True
  limit_train_batches: ${trainer.limit_train_batches}

vars:
  num_rollout_steps: 5
  max_pushforward_steps: 3

trainer:
  log_every_n_steps: 1
  limit_val_batches: 1
  limit_train_batches: 5
  limit_test_batches: 1
  val_check_interval: 10
  max_steps: 50000

callbacks:
  early_stopping:
    patience: 50000
