# @package _global_

# to execute this experiment run:
# python train.py experiment=gns_experiment
defaults:
  - override /model: gns
  - override /data: tgv3d
  - override /trainer: gpu
  - override /vars: tgv3d
  - override /callbacks: custom
  - override /logger: wandb

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

data:
  batch_size: 1
  max_pushforward_steps: 5
  input_seq_length: 2

model:
  net:
    particle_dimension: 3
    node_in: 19
    edge_in: 4
    dataset_path: ${data.data_dir} # Path to the dataset
    noise_std: 6.7e-4
  seed: 12345
  pbc: true
  pushforward:
    steps: [0, 10, 700]   # Training steps unlocking stages
    unrolls: #[0, 2, ${max_pushforward_steps}]   # Unroll step options for each stage
      - 0
      - 2
      - ${data.max_pushforward_steps}
    probs: [7, 2, 1]       # Relative probabilities for each unroll step
  

trainer:
  min_epochs: 0
  max_epochs: 2
  gradient_clip_val: 0.5
  accelerator: "gpu"

tags: ["tgv", "gns"]

logger:
  wandb:
    project: "tgv3d"
