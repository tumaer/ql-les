# @package _global_

# to execute this experiment run:
# python eval.py experiment=gns_test_tgv2d
#It is important to note that the ckpt_path should be replaced with the path to the exact checkpoint file!
defaults:
  - override /vars: tgv2d
  - override /model: gns
  - override /data: tgv2d
  - override /trainer: gpu
  - override /callbacks: custom
  - override /logger: wandb

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

#for eval: Replace with the path to the exact checkpoint file
ckpt_path: ${paths.log_dir}/train/runs/debugging_run/checkpoints/epoch_epoch=006.ckpt

model:
  _target_: src.models.gns_module.GNSLitModule  # Adjust this to the actual path for your GNS Lightning module
  net:
    node_in: 26 # num_past_velocities * dim + particle_type_embedding_size
    edge_in: 3
    node_out: ${vars.dim} #Specify the dimension of the output. Example: 2 for predicting a single acceleration value for 2D coordinates
    dataset_path: ${data.data_dir} # Path to the dataset
    noise_std: 3.e-4 #Random-walk noise
  pbc: true
  pushforward:
    steps: [-1, 200_000, 300_000, 400_000]   # Training steps unlocking stages
    unrolls: #[0, 2, ${max_pushforward_steps}]   # Unroll step options for each stage
      - 0
      - 1
      - 2
      - ${vars.max_pushforward_steps}
    probs: [18, 2, 1, 1]       # Relative probabilities for each unroll step
  alpha_v: 1.0
  alpha_u: 0.0
  active_metrics: ["mse", "mae", "e_kin"]
  visualize: 
    vis_test: 
      out_type: "none"
      rollout_dir: "${paths.log_dir}/rollouts/wandb_id/test" #interpolation of the ID is done in the main script

trainer:
  min_epochs: 0
  max_epochs: 42  # on 2D TGV with 12000 samples, this means 504k steps
  check_val_every_n_epoch: 1

tags: ["tgv", "gns"]

logger:
  wandb:
    project: "tgv2d"

seed: 12345