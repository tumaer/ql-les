# @package _global_
defaults:
  - /experiment/kolm_every_1/base
  - override /model: lles

model:
  _target_: src.models.gnn_module.GNNLitModule
  net:
    noise_std: 0.0
    hidden_dims: [256, 512, 256]
    activation: "relu" # tanh, relu, sigmoid
  pushforward: null
  vel_solver: "simple" # "simple", "tvf", "neural_sph"
  alpha_u: 1.0
  alpha_v: 1.0

logger:
  wandb:
    project: "kolm2d_every1"

tags: ["kolm1", "lles"]
