# @package _global_

# to execute this experiment run:
# python eval.py experiment=gns_eval_2d_tgv
#It is important to note that the ckpt_path should be replaced with the path to the exact checkpoint file!
defaults:
  - override /model: gns
  - override /data: 2d_tgv
  - override /trainer: default
  - override /callbacks: custom

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["eval", "tgv", "gns"]

#for eval: Replace with the path to the exact checkpoint file
ckpt_path: ${paths.log_dir}/train/runs/2025-01-14_12-57-09/checkpoints/epoch=1-step=12000.ckpt 

data:
  max_pushforward_steps: 5
  max_rollout_steps: 20 # Number of ground truth time steps sampled for evaluation/validation
  batch_size: 1

model:
  net:
    dataset_path: ${data.data_dir} # Path to the dataset
    connectivity_radius: 0.029  #Default value for 2D TGV dataset(derived from metadata), can be adjusted
  noise_std: 3e-4
  pbc: true
  pushforward:
    steps: [0, 500, 700]   # Training steps unlocking stages
    unrolls: #[0, 2, ${max_pushforward_steps}]   # Unroll step options for each stage
      - 0
      - 2
      - ${data.max_pushforward_steps}
    probs: [7, 2, 1]       # Relative probabilities for each unroll step
  num_rollout_steps: ${data.max_rollout_steps} # Number of rollout steps generated by the model

trainer:
  min_epochs: 0
  max_epochs: 2
  gradient_clip_val: 0.5
  accelerator: "gpu"

logger:
  wandb:
    tags: ${tags}
    group: "gns"
  aim:
    experiment: "gns"

seed: 12345