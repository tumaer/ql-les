# @package _global_
defaults:
  - override /model: gns
  - override /data: kolm2d_every1
  - override /trainer: gpu
  - override /vars: default
  - override /callbacks: default
  - override /logger: wandb

model:
  _target_: src.models.gnn_module.GNNLitModule
  net:
    noise_std: 3.0e-4
  pushforward: null
  vel_solver: "simple"
  v2u_solver: "same" #  ["none", "same", "smooth", "gns"]. Only "none" compatible with vel_solver!="simple"

tags: ["kolm", "gns"]

logger:
  wandb:
    project: "lag_kolm2d_every1"

seed: 12345

data:
  num_workers: 2
