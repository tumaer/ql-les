# 2-D TGV production run with TVF position correction enabled.
# Format: key = value

dim = 2
nx = 200
L = 1.0
u_ref = 1.0
nu = 0.01
dt = 0.000125
t_end = 6.0

# If tvf_factor = 0.0, TVF is effectively disabled.
tvf_factor = 1.0
noise_std_factor = 0.0

print_every = 400
save_every = 1600
save_dir = res/tgv2d_200_tvf

# Optional: initialize x/u from a previously saved state file.
# Keep empty to use analytic TGV initialization.
init_state_file = res/tgv2d_200_init/relaxed_state.bin
