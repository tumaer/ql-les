# 3D HIT relaxation pass — settles particle positions onto a near-uniform lattice.
# Format: key = value
# Relaxation should run for around 2k steps
dim = 3
nx = 256
L = 6.283185307179586
u_ref = 4.0
nu = 0.002
dt = 0.00025
t_end = 0.5

# If tvf_factor = 0.0, TVF is effectively disabled.
tvf_factor = 1.0
noise_std_factor = 0.2

print_every = 100
save_every = 100
save_dir = res/hit3d_256_init

# Optional: initialize x/u from a previously saved state file.
# Keep empty to use analytic TGV initialization.
init_state_file =
