# 3-D Taylor-Green Vortex SPH config
# Domain: [0, 2pi]^3 with one TGV mode per dimension
# Format: key = value

dim = 3
nx = 64
L = 6.283185307179586
u_ref = 1.0
# Re=100 case
nu = 0.01
dt = 0.004
t_end = 10

# tvf_factor = 0.0 disables TVF
tvf_factor = 1.0
noise_std_factor = 0.0

print_every = 25
save_every = 25
save_dir = res/tgv3d_64_tvf

# Optional: load initial state from a saved binary file.
# Keep empty to use the analytic TGV initial condition.
init_state_file = res/tgv3d_64_init/relaxed_state.bin
