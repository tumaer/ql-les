# 2-D TGV relaxation pass — settles particle positions onto a near-uniform lattice.
# Format: key = value
# 2k relaxation steps at CFL=0.275
dim = 2
nx = 100
L = 1.0
u_ref = 1.0
nu = 0.01
dt = 0.00025
t_end = 0.5

# If tvf_factor = 0.0, TVF is effectively disabled.
tvf_factor = 1.0
noise_std_factor = 0.2

print_every = 200
save_every = 1000
save_dir = res/tgv2d_100_init

# Optional: initialize x/u from a previously saved state file.
# Keep empty to use analytic TGV initialization.
init_state_file =
