# 3-D Taylor-Green Vortex SPH config
# Domain: [0, 2pi]^3 with one TGV mode per dimension
# Format: key = value
# Relax particles for 2k steps
dim = 3
nx = 64
L = 6.283185307179586
u_ref = 1.0
# Re=100 case, dt = CFL * h / (11u) = 0.224*2pi/64 / 11 = 0.002
nu = 0.01
dt = 0.002
t_end = 4

# tvf_factor = 0.0 disables TVF
tvf_factor = 1.0
noise_std_factor = 0.2

print_every = 10
save_every = 1000
save_dir = res/tgv3d_64_init

# Optional: load initial state from a saved binary file.
# Keep empty to use the analytic TGV initial condition.
init_state_file =
